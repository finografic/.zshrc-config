name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n on every tracked .zsh file
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            zsh -n "$f" || fail=1
          done < <(git ls-files -z '*.zsh')
          exit $fail

  zsh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Environment detection matrix
        run: zsh tests/test-detect.zsh
      - name: lib/ modules must source inertly
        run: zsh tests/test-lib-inert.zsh "$GITHUB_WORKSPACE"
      - name: Profile manifest loader
        run: zsh tests/test-profile-loader.zsh
      - name: Every profile boots clean
        run: zsh tests/test-profile-boot.zsh
      - name: zupdate (runs against a throwaway repo, never this one)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch master
          zsh tests/test-zupdate.zsh

  startup-budget:
    runs-on: ubuntu-latest
    # Soft-fail (P4.3/P7.4): CI runners are noisy shared hardware, so this
    # compares a RATIO between profiles rather than asserting an absolute ms
    # budget. See docs/benchmarks/README.md for why absolute numbers from any
    # sandboxed/virtualised runner are not trustworthy on their own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: codex must be meaningfully faster than the full profile
        run: |
          set -e
          extract_p50() { grep -oE '"p50_ms": [0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+(\.[0-9]+)?$'; }
          full_p50="$(zsh scripts/bench-startup.zsh --zenv home-linux -n 10 --json | extract_p50)"
          codex_p50="$(zsh scripts/bench-startup.zsh --zenv codex -n 10 --json | extract_p50)"
          echo "home-linux p50: ${full_p50}ms, codex p50: ${codex_p50}ms"
          awk -v full="$full_p50" -v codex="$codex_p50" 'BEGIN { exit !(codex < full) }' \
            || { echo "::warning::codex (${codex_p50}ms) is not faster than home-linux (${full_p50}ms) — expected, since is-agent-shell should short-circuit bootstrap/index.zsh entirely"; exit 0; }

  shell-format:
    runs-on: ubuntu-latest
    # Soft-fail (P7.4): this repo's own settings disagree with themselves on
    # tabs vs. spaces for shell files — .editorconfig defaults to spaces,
    # but .vscode/settings.json's [shellscript] block configures mkhl.shfmt
    # with editor.insertSpaces: false (tabs). Until that's resolved, shfmt's
    # own opinion may disagree with either, so this reports rather than gates.
    #
    # Scoped to *.sh only, not *.zsh: shfmt parses bash/posix/mksh, not zsh's
    # syntax extensions (${(z)...}, array flags, etc.), which this repo's
    # .zsh files use throughout — running it against them would fail to
    # parse, not just produce a formatting diff.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: shfmt --diff on every tracked *.sh file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            shfmt --diff "$f" || fail=1
          done < <(git ls-files -z '*.sh')
          exit $fail

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for known personal/employer identifiers
        run: |
          set -e
          # `apnaes` closed out by the P2.1 server-linux rename. `finografic` is
          # deliberately NOT here: it is both a real npm scope (@finografic/*, a
          # legitimate dependency) and still present in the untouched personal
          # repo-alias block in profiles/home-macos/home-macos.aliases.zsh, which
          # P7.3/README work is expected to address separately.
          pattern='justin\.rankin|justin\.blair\.rankin|@sage\.com|hostinger|/Users/justin|/home/justin|apnaes|([0-9]{1,3}\.){3}[0-9]{1,3}'
          # docs/todo and .agents/handoff.md are process/planning docs that
          # legitimately narrate history (e.g. "apnaes was renamed to ...").
          # Test files deliberately contain synthetic secret-shaped fixtures.
          # Loopback and unspecified addresses are not PII.
          if git grep -InE "$pattern" -- . ':!docs/todo/**' ':!.agents/**' ':!tests/**' ':!**/*.test.ts' ':!**/*.spec.ts' ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml' \
            | grep -vE '127\.0\.0\.1|0\.0\.0\.0|255\.255\.255\.255'; then
            echo "::error::possible secret/PII match above — see docs/todo/TODO_PUBLIC_RELEASE_REFACTOR.md P0.2"
            exit 1
          fi

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm format:check
      - run: pnpm lint:md

  commitlint:
    runs-on: ubuntu-latest
    # The husky commit-msg hook enforces this locally, but --no-verify
    # bypasses it (which is exactly how ~570 pre-rewrite commits got past it)
    # and a fork's PR never runs a hook it didn't install. This is the same
    # check, run somewhere it can't be skipped.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD
          fi

  zconf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: zconf unit tests
        run: pnpm test
      - name: zconf typecheck
        run: pnpm typecheck
      - name: Lint the load-model contract
        run: pnpm doctor
      # Complements the grep-based `secret-scan` job above rather than
      # replacing it: that one is a dependency-free backstop that still runs
      # if this package is ever broken, and the two use different patterns.
      - name: Scan for secrets and PII
        run: pnpm scan
