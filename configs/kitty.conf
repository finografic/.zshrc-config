# -----------------------------
# Font
# -----------------------------
# font_family      MesloLGS NF
font_family      MesloLGS NF Light
font_size        14.0

# Reduce default heaviness (avoid bold unless explicitly requested)
bold_font        auto
italic_font      auto
bold_italic_font auto

# -----------------------------
# Line height / spacing
# -----------------------------
line_height      4

# -----------------------------
# Window padding (inner spacing)
# -----------------------------
# Similar to Ghostty / iTerm defaults
window_padding_width 14
window_padding_height 14

# Optional: keep padding even when maximized
window_padding_balance true

# -----------------------------
# Cursor
# -----------------------------
cursor_shape     beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.7
cursor_stop_blinking_after 0

# -----------------------------
# Rendering tweaks (cleaner text)
# -----------------------------
# Slightly lighter text rendering on macOS
macos_thicken_font -2
macos_traditional_fullscreen no
# text_composition_strategy 0.0 0

# -----------------------------
# Bold behavior
# -----------------------------
# Do NOT fake bold for normal text
disable_ligatures never
bold_font auto
force_ltr no

# -----------------------------
# Misc quality-of-life
# -----------------------------
scrollback_lines 10000
enable_audio_bell no

# -----------------------------
# Selection color
# -----------------------------

selection_background #ffffff
selection_foreground #000000

# -----------------------------
# Split Panes
# -----------------------------

# Panes split
map cmd+t launch --location=hsplit
map cmd+shift+t launch --location=vsplit

# Default resize bindings
map ctrl+shift+r start_resize_window

map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter

active_border_color #444444
inactive_border_color #444444

